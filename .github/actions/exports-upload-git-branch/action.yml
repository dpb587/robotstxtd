name: exports-upload-git-branch
inputs:
  exports_path:
    default: exports
  branch:
    default: exports/${{ github.ref }}
  upload_docker_image:
    default: false
  docker_image_registry:
    default: ghcr.io
  docker_image_username:
    default: ${{ github.actor }}
  docker_image_password:
    default: ${{ github.token }}
runs:
  using: "composite"
  steps:
    - name: artifacts
      shell: bash
      run: |
        cd "${{ inputs.exports_path }}"

        find artifacts -type f -mindepth 2 -maxdepth 2 -exec mv {} artifacts/ \;

        cd artifacts
        find . -type f -maxdepth 1 -exec sha256sum {} \; | sed 's#  \./#  #' > ../sha256sum.txt

        if [ -s ../sha256sum.txt ]
        then
          mv ../sha256sum.txt ./
        else
          rm ../sha256sum.txt
        fi

    # upload_docker_image
    - name: docker-login
      if: inputs.upload_docker_image == 'true'
      uses: docker/login-action@v2
      with:
        registry: ${{ inputs.docker_image_registry }}
        username: ${{ inputs.docker_image_username }}
        password: ${{ inputs.docker_image_password }}
    - name: docker-push
      if: inputs.upload_docker_image == 'true'
      shell: bash
      run: |
        cd "${{ inputs.exports_path }}/artifacts"

        echo 'image,tag,digest' > metadata-docker-images.csv

        for refsfile in $( find . -type f -path '*/docker-image/refs' -maxdepth 3 -mindepth 3 )
        do
          while read -r image
          do
            docker push "${image}"
            echo "$( sed -E 's/(.+):([^:]+)/\1,\2/' <<< "${image}" ),$( docker inspect --format='{{ index .RepoDigests 0 }}' "${image}" | cut -d@ -f2 )" >> metadata-docker-images.csv
          done < "${refsfile}"
        done

    # git-branch
    - name: git-branch-prepare
      shell: bash
      run: |
        cd "${{ inputs.exports_path }}"

        git init .
        git config init.defaultBranch "${{ inputs.branch }}"
        git remote add origin "https://${{ github.actor }}:${{ github.token }}@${GITHUB_SERVER_URL#"https://"}/${GITHUB_REPOSITORY}.git"
        find artifacts -type f -maxdepth 1 -exec git add {} \;
    - name: git-branch-push
      uses: stefanzweifel/git-auto-commit-action@v4
      with:
        commit_message: ${{ github.sha }}
        repository: ${{ inputs.exports_path }}
        branch: ${{ inputs.branch }}
        create_branch: true
        push_options: --force
        add_options: -u
        skip_fetch: true
