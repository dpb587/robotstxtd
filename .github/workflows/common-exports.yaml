name: exports
permissions:
  contents: write
on:
  workflow_call:
    secrets:
      CLN_BOT_GITHUB_INTERNALREAD_APP_ID:
        required: true
      CLN_BOT_GITHUB_INTERNALREAD_PRIVATE_KEY:
        required: true
      GOOGLE_CREDENTIALS:
        required: true
jobs:
  main:
    name: main
    runs-on: ubuntu-latest
    steps:
    - id: github_organization_auth
      uses: tibdex/github-app-token@v1.8.0
      with:
        app_id: ${{ secrets.CLN_BOT_GITHUB_INTERNALREAD_APP_ID }}
        private_key: ${{ secrets.CLN_BOT_GITHUB_INTERNALREAD_PRIVATE_KEY }}
    - id: google_auth
      uses: google-github-actions/auth@v1
      with:
        create_credentials_file: false
        credentials_json: ${{ secrets.GOOGLE_CREDENTIALS }}
        token_format: access_token
    - name: docker-login
      uses: docker/login-action@v2
      with:
        registry: us-docker.pkg.dev
        username: oauth2accesstoken
        password: ${{ steps.google_auth.outputs.access_token }}
    - name: checkout
      uses: actions/checkout@v3
      with:
        path: repository
    - id: exports
      name: exports-prepare
      uses: ./repository/.github/actions/exports-prepare
    - name: exports-build-robotstxtd-image
      env:
        EXPORTS_BUILD_GITREF: ${{ steps.exports.outputs.build_gitref }}
        EXPORTS_BUILD_GITSHA: ${{ steps.exports.outputs.build_gitsha }}
        EXPORTS_VERSION_NUMBER: ${{ steps.exports.outputs.version_number }}
        EXPORTS_VERSION_LABELS: ${{ steps.exports.outputs.version_labels }}
      run: |
        cd repository/
        ./tasks/exports:build:robotstxtd-image/run.sh ../exports
    - name: exports-upload-git-branch
      if: github.ref_type == 'branch'
      uses: ./repository/.github/actions/exports-upload-git-branch
      with:
        upload_docker_image: true
        docker_image_registry: us-docker.pkg.dev
        docker_image_username: oauth2accesstoken
        docker_image_password: ${{ steps.google_auth.outputs.access_token }}
    - name: exports-upload-github-release
      if: github.ref_type == 'tag'
      uses: ./repository/.github/actions/exports-upload-github-release
      with:
        upload_docker_image: true
        docker_image_registry: us-docker.pkg.dev
        docker_image_username: oauth2accesstoken
        docker_image_password: ${{ steps.google_auth.outputs.access_token }}
