name: release
permissions:
  contents: write
on:
  push:
    tags:
      - 'v*'
jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-latest
    outputs:
      is_latest_release: ${{ steps.assertions.outputs.is_latest_release }}
    steps:
      - name: checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - id: assertions
        name: assertions
        run: |
          if ! git ls-remote --tags origin '${{ github.ref_name }}^{}'
          then
            echo tag is not annotated >&2
            exit 1
          elif ! git merge-base --is-ancestor $( git rev-parse HEAD ) refs/remotes/origin/main
          then
            echo tag diveraged from main >&2
            exit 1
          fi

          if [[ "${{ github.ref_name }}" == "$( git tag -l --sort=-version:refname | head -n1 )" ]]
          then
            echo "is_latest_release=true" >> "${GITHUB_OUTPUT}"
          else
            echo "is_latest_release=false" >> "${GITHUB_OUTPUT}"
          fi
      - name: create-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --draft \
            --prerelease=${{ toJSON(contains(github.ref_name, '-')) }} \
            --title "${{ github.ref_name }}"
  exports:
    name: exports
    uses: ./.github/workflows/common-exports.yaml
    needs:
      - prepare
    secrets:
      CLN_BOT_GITHUB_INTERNALREAD_APP_ID: ${{ secrets.CLN_BOT_GITHUB_INTERNALREAD_APP_ID }}
      CLN_BOT_GITHUB_INTERNALREAD_PRIVATE_KEY: ${{ secrets.CLN_BOT_GITHUB_INTERNALREAD_PRIVATE_KEY }}
      GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
  publish:
    name: publish
    runs-on: ubuntu-latest
    needs:
      - prepare
      - exports
    steps:
      - name: checkout
        uses: actions/checkout@v3
      - name: publish-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ github.ref_name }}" -p metadata-docker-images.csv -p sha256sum.txt

          if [ -e metadata-docker-images.csv ]
          then
            (
              echo '<details open><summary><code>metadata-docker-images.csv</code> (<a href="${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/metadata-docker-images.csv">download</a>)</summary>'
              echo
              echo '| image | tag | digest |'
              echo '| ----- | --- | ------ |'
              sed -E '1d;s/,/ | /g;s/(.+)/| \1 |/' metadata-docker-images.csv
            ) >> notes.md
          fi

          if [ -e sha256sum.txt ]
          then
            (
              echo '<details open><summary><code>sha256sum.txt</code> (<a href="${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/sha256sum.txt">download</a>)</summary>'
              echo
              echo '```'
              cat sha256sum.txt
              echo '```'
            ) >> notes.md
          fi

          gh release edit "${{ github.ref_name }}" \
            --draft=false \
            --notes-file=notes.md \
            --latest=${{ needs.prepare.outputs.is_latest_release }}
