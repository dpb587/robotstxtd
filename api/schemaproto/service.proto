syntax = "proto3";

package io.github.dpb587.robotstxtd.api;
option go_package = "github.com/dpb587/robotstxtd/api";

import "google/protobuf/timestamp.proto";

service Service {
  rpc GetBot(GetBot.Request) returns (GetBot.Response);

  rpc GetOrigin(GetOrigin.Request) returns (GetOrigin.Response);
  rpc FlushOrigin(FlushOrigin.Request) returns (FlushOrigin.Response);

  rpc EvalUrl(EvalUrl.Request) returns (EvalUrl.Response);
}

message Bot {
  string name = 1;
  string version = 2;
  string url = 3;
  string from = 4;
}

message GetBot {
  message Request {}

  message Response {
    Bot bot = 1;
  }
}

message GetOrigin {
  message Request {
    string origin = 1;
  }

  message Response {
    google.protobuf.Timestamp lookup_time = 1;
    google.protobuf.Timestamp stale_time = 2;
    uint32 response_status_code = 3;
    optional string response_headers = 4;
    optional string response_body = 5;
    optional string response_body_sha256 = 6;
    optional string error_message = 7;
  }
}

message FlushOrigin {
  message Request {
    string origin = 1;
    optional google.protobuf.Timestamp min_lookup_time = 2;
  }

  message Response {}
}

message EvalUrl {
  message Request {
    string url = 1;
  }

  message Response {
    message ResultAllow {}

    message ResultDisallow {
      optional uint32 match_line = 1;
      optional string match_line_contents = 2;
    }

    message ResultError {
      string error_message = 1;
    }

    google.protobuf.Timestamp lookup_time = 1;

    oneof result {
      ResultAllow result_allow = 2;
      ResultDisallow result_disallow = 3;
      ResultError result_error = 4;
    }
  }
}
